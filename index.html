        // Helper function to check if it's after 4 PM or a weekend (Central Daylight Time)
        function isAfterHours() {
            const now = new Date();
            // Using Intl.DateTimeFormat with a specific timeZone for accurate check in Burleson, TX
            const options = {
                timeZone: 'America/Chicago', // Central Time Zone for Burleson, TX
                hour: 'numeric',
                minute: 'numeric',
                hour12: false, // Use 24-hour format for easier comparison
                weekday: 'long'
            };
            const localTime = new Intl.DateTimeFormat('en-US', options).format(now);
            const [timePart, weekday] = localTime.split(' '); // Split "16:00 Friday" into parts
            const [hour, minute] = timePart.split(':').map(Number);

            const isWeekend = (weekday === 'Saturday' || weekday === 'Sunday');
            const after4PM = (hour >= 16); // 16:00 is 4 PM

            return isWeekend || after4PM;
        }

        // Function to generate the certified technician decision text based on time
        function getCertifiedTechDecisionWithTime() {
            const isAfter = isAfterHours();
            const actionBase = "Turn the water off to the home immediately, flip the breaker in the main breaker panel that is labeled “Water Heater”, and ";

        function displayNode(nodeKey) {
            const node = flowTree[nodeKey];
            optionsContainer.innerHTML = ''; // Clear previous options
            decisionText.classList.add('hidden'); // Hide decision text by default
            backButton.classList.remove('hidden'); // Show back button
            emailButton.classList.add('hidden'); // Hide email button by default

            if (node.question) {
                questionText.innerHTML = node.question;
                node.options.forEach(option => {
                    const button = document.createElement('button');
                    button.textContent = option.text;
                    button.className = 'bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded transition duration-200 ease-in-out text-base md:text-lg text-left';
                    button.onclick = () => {
                        currentPath.push(nodeKey); // Add current node to path history
                        displayNode(option.next);
                    };
                    optionsContainer.appendChild(button);
                });
                optionsContainer.classList.remove('hidden');
                questionText.classList.remove('hidden');
            } else if (node.decision) {
                questionText.classList.add('hidden');
                optionsContainer.classList.add('hidden');
                decisionText.innerHTML = node.decision.text;
                decisionText.classList.remove('hidden');

                // Check if the decision text contains an email link for the email button
                const emailMatch = node.decision.text.match(/<a href=['"]mailto:([^'"]+)['"]/);
                // The "other_start" decision already contains the mailto link as part of its text,
                // so we don't need the dedicated button for it.
                if (emailMatch && nodeKey !== "other_start") {
                    emailButton.href = emailMatch[1];
                    emailButton.classList.remove('hidden');
                } else {
                    emailButton.classList.add('hidden'); // Hide if no mailto link found or for other_start
                }

                // If it's a final decision, you might want to hide the "Back" button or
                // encourage starting over. For now, we keep "Back" available.
            }
        }

        function goBack() {
            if (currentPath.length > 0) {
                const prevNodeKey = currentPath.pop();
                displayNode(prevNodeKey);
            } else {
                // If there's no history, go back to the start node
                displayNode("start");
                backButton.classList.add('hidden'); // Hide back button at start
            }
        }

        function startOver() {
            currentPath = []; // Clear history
            displayNode("start");
            backButton.classList.add('hidden'); // Hide back button
            emailButton.classList.add('hidden'); // Hide email button
        }

        // Event Listeners
        backButton.addEventListener('click', goBack);
        startOverButton.addEventListener('click', startOver);
