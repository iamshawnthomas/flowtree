        /* Basic styling to make it look decent and functional */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-family: sans-serif;
        }
        .flow-button {
            background-color: #4CAF50; /* Green */
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            width: 100%; /* Make buttons take full width of grid column */
        }
        .flow-button:hover {
            background-color: #45a049;
        }
        .back-button {
            background-color: #6b7280; /* Gray */
            color: white;
            padding: 10px 20px;
            margin: 5px 5px 15px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            width: auto;
        }
        .back-button:hover {
            background-color: #4b5563;
        }
        .question-text {
            font-size: 1.25rem; /* Equivalent to text-xl in Tailwind */
            font-weight: 600; /* Equivalent to font-semibold in Tailwind */
            color: #333;
            margin-bottom: 1.5rem; /* Equivalent to mb-6 in Tailwind */
        }
        .decision-text {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
        }
        .decision-text strong {
            color: #000; /* Make bold text stand out more */
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Responsive grid */
            gap: 10px;
        }
        .hidden {
            display: none;
        }

</head>

                }
            },
            "appliance_dryer_noises": {
                "decision": {
                    "text": "Some dryer noises are normal, but excessive grinding, squealing, or banging may indicate mechanical issues. Contact your **warranty department** or **appliance service provider** for evaluation. Samsung appliances may have a 2-year warranty.",
                    "action": "Contact warranty/service provider for excessive/unusual noises."
                }
            },
            "appliance_water_heater": {
                "question": "What water heater issue are you experiencing?",
                "options": [
                    { "text": "No hot water", "next": "appliance_water_heater_no_hot" },
                    { "text": "Not enough hot water", "next": "appliance_water_heater_insufficient" },
                    { "text": "Water too hot", "next": "appliance_water_heater_too_hot" },
                    { "text": "Leaking", "next": "appliance_water_heater_leaking" },
                    { "text": "Strange noises", "next": "appliance_water_heater_noises" }
                ]
            },
            "appliance_water_heater_no_hot": {
                "decision": {
                    "text": "Check if the pilot light is lit (gas) or if breakers have tripped (electric). Check for any error codes on the display. If these are fine but still no hot water, contact your **warranty department** for evaluation and repair.",
                    "action": "Check pilot/breakers/error codes; contact warranty if fine but no hot water."
                }
            },
            "appliance_water_heater_insufficient": {
                "decision": {
                    "text": "Check the temperature setting (should be around 120°F). If setting is correct but hot water runs out quickly, contact your **warranty department** for evaluation of the unit's capacity and function.",
                    "action": "Check temperature setting; contact warranty if setting correct but insufficient capacity."
                }
            },
            "appliance_water_heater_too_hot": {
                "decision": {
                    "text": "Water that's too hot can be dangerous. Lower the temperature setting to around 120°F. If water is still too hot after adjustment, contact your **warranty department** immediately for safety evaluation.",
                    "action": "Lower temperature to 120°F; contact warranty immediately if still too hot."
                }
            },
            "appliance_water_heater_leaking": {
                "decision": {
                    "text": "Water heater leaks require immediate attention. Turn off the power and water supply if safe to do so. Contact your **warranty department** immediately for evaluation and repair.",
                    "action": "Turn off power/water if safe; contact warranty immediately."
                }
            },
            "appliance_water_heater_noises": {
                "decision": {
                    "text": "Popping or rumbling sounds may indicate sediment buildup. Loud banging or grinding sounds require immediate attention. Contact your **warranty department** for evaluation and service.",
                    "action": "Contact warranty for evaluation and service."
                }
            },
            "hvac_thermostat": {
                "question": "What thermostat issue are you experiencing?",
                "options": [
                    { "text": "Display not working or blank", "next": "hvac_thermostat_display" },
                    { "text": "Not responding to temperature changes", "next": "hvac_thermostat_not_responding" },
                    { "text": "Temperature readings seem incorrect", "next": "hvac_thermostat_incorrect_reading" },
                    { "text": "System not turning on when it should", "next": "hvac_thermostat_system_not_on" }
                ]
            },
            "hvac_thermostat_display": {
                "decision": {
                    "text": "Check if the thermostat needs batteries (if battery-powered) and ensure it has power at the breaker. If display still doesn't work, contact your **warranty department** or **HVAC service provider** for replacement.",
                    "action": "Check batteries/power; contact warranty/HVAC service for replacement if no display."
                }
            },
            "hvac_thermostat_not_responding": {
                "decision": {
                    "text": "Try resetting the thermostat according to the manual instructions. Check if it has power and all wires are connected. If it still doesn't respond, contact your **warranty department** or **HVAC service provider**.",
                    "action": "Reset per manual/check power/wires; contact warranty/HVAC service if unresponsive."
                }
            },
            "hvac_thermostat_incorrect_reading": {
                "decision": {
                    "text": "Ensure the thermostat isn't in direct sunlight or near heat sources. Check if calibration is needed per the manual. If readings are still incorrect, contact your **warranty department** or **HVAC service provider**.",
                    "action": "Check location/calibrate per manual; contact warranty/HVAC service if still incorrect."
                }
            },
            "hvac_thermostat_system_not_on": {
                "decision": {
                    "text": "Check that the thermostat is set to the correct mode (heat/cool) and the temperature setting would call for the system to run. Check if any breakers have tripped. If settings are correct but system won't run, contact your **warranty department** or **HVAC service provider**.",
                    "action": "Check mode/temperature settings/breakers; contact warranty/HVAC service if correct but won't run."
                }
            }
        };

        /**
         * Navigate to a specific node in the flow tree and update the display
         * @param {string} nodeId - The ID of the node to navigate to
         * @param {boolean} addToHistory - Whether to add this navigation to history (default: true)
         */
        function navigateToNode(nodeId, addToHistory = true) {
            // Add current node to history stack before navigating (except when going back)
            if (addToHistory && currentNode && currentNode !== nodeId) {
                historyStack.push(currentNode);
            }
            
            currentNode = nodeId;
            renderCurrentNode();
        }

        /**
         * Go back to the previous node in the history stack
         */
        function goBack() {
            if (historyStack.length > 0) {
                const previousNode = historyStack.pop();
                navigateToNode(previousNode, false); // Don't add to history when going back
            }
        }

        /**
         * Reset the troubleshooting flow to the beginning
         */
        function resetFlow() {
            currentNode = "warranty_check";
            historyStack = [];
            renderCurrentNode();
        }

        /**
         * Render the current node content based on the flow tree
         */
        function renderCurrentNode() {
            const node = flowTree[currentNode];
            const flowContent = document.getElementById('flowContent');
            const resetButton = document.getElementById('resetButton');
            
            if (!node) {
                flowContent.innerHTML = '<p class="text-red-500">Error: Node not found</p>';
                return;
            }

            let html = '';

            // Add back button (show on all screens except warranty_check)
            if (currentNode !== "warranty_check" && historyStack.length > 0) {
                html += '<button onclick="goBack()" class="back-button mb-4">← Back</button>';
            }

            if (node.question) {
                // Question node
                html += `<div class="question-text">${node.question}</div>`;
                
                if (node.options && node.options.length > 0) {
                    html += '<div class="button-grid">';
                    node.options.forEach(option => {
                        html += `<button class="flow-button" onclick="navigateToNode('${option.next}')">${option.text}</button>`;
                    });
                    html += '</div>';
                }
            } else if (node.decision) {
                // Decision/result node
                html += `<div class="decision-text">${node.decision.text}</div>`;
                if (node.decision.action) {
                    html += `<div class="decision-text mt-4"><strong>Action:</strong> ${node.decision.action}</div>`;
                }
                resetButton.classList.remove('hidden');
            }

            flowContent.innerHTML = html;
            
            // Hide reset button for question nodes
            if (node.question) {
                resetButton.classList.add('hidden');
            }
        }

        // Event listeners
        document.getElementById('resetButton').addEventListener('click', resetFlow);

        // Initialize the flow
        renderCurrentNode();
    </script>
</body>
</html>
